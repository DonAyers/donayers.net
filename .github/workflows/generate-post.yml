name: Daily AI Blog Post

on:
  schedule:
    - cron: '0 10 * * *'  # 10:00 AM UTC (2-3 AM PT)
  workflow_dispatch:       # Manual trigger for testing

permissions:
  contents: write
  models: read  # allows GITHUB_TOKEN to access GitHub Models API

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Anthropic SDK
        run: npm install --no-save @anthropic-ai/sdk

      - name: Generate blog post
        env:
          # GitHub Models (default): prefers COPILOT_CLI_PAT, falls back to GITHUB_TOKEN
          GITHUB_MODELS_TOKEN: ${{ secrets.COPILOT_CLI_PAT || github.token }}
          # Anthropic (fallback): only used if ANTHROPIC_API_KEY secret is set
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node .github/scripts/generate-post.js

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/blog/
          git diff --staged --quiet || (git commit -m "ai: blog post $(date -u +%Y-%m-%d)" && git push)
